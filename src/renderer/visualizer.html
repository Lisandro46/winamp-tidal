<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:*"
    />
    <title>Milkdrop</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #preset {
        position: fixed;
        left: 16px;
        top: 12px;
        color: #fff;
        font: 14px/1.3 Tahoma, Arial, sans-serif;
        text-shadow: 0 0 4px #000;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #preset.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="preset"></div>
    <script type="module" src="./visualizer.ts"></script>
  </body>
</html>
